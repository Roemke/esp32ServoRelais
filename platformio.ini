; PlatformIO Project Configuration
; ESP32 D1 Mini - Solar/Bluetti/Servo Steuerung
; Umgestellt von Arduino IDE

[env:esp32dev]
platform = espressif32
board = wemos_d1_mini32
framework = arduino

; Partition-Schema: Minimal SPIFFS (Large Apps with OTA)
; entspricht der Arduino IDE Einstellung "Minimal SPIFFS (1.9MB APP with OTA/190KB SPIFFS)"
board_build.partitions = min_spiffs.csv

; Upload-Geschwindigkeit
upload_speed = 921600

; Serieller Monitor
monitor_speed = 115200

; Include-Pfad für Header-Dateien
build_flags =
    -I include
    -D ESP32=1

; Bibliotheken (über PlatformIO Registry oder lib_deps)
lib_deps =
    ; WiFi, ArduinoOTA, Preferences, HTTPClient -> im ESP32-Framework enthalten

    ; Async Webserver Stack
    mathieucarbou/AsyncTCP @ ^3.3.2
    mathieucarbou/ESPAsyncWebServer @ ^3.3.12

    ; OTA über Webinterface
    ; Hinweis: AsyncElegantOTA ist veraltet, Empfehlung: ElegantOTA (neuer Fork)
    ; ayushsharma82/AsyncElegantOTA @ ^2.2.7  ; <-- falls du die alte Version nutzt
    ayushsharma82/ElegantOTA @ ^3.1.7

    ; JSON
    bblanchon/ArduinoJson @ ^7.3.1

    ; MQTT
    knolleary/PubSubClient @ ^2.8

    ; Servo (ESP32-kompatibel, alte Version wegen Compiler-Kompatibilität)
    ; RoboticsBrno/ESP32-Arduino-Servo-Library @ ^1.0.3
    madhephaestus/ESP32Servo @ ^3.0.6

    ; Modbus TCP (für SolarEdge-Wechselrichter)
    emelianov/modbus-esp8266 @ ^4.1.0

    ; Bluetti Bibliothek - lokal einbinden (s. lib/ Verzeichnis)
    ; falls als externe Lib: bitte in lib/ ablegen

; OTA-Konfiguration (optionale Upload-Methode über WLAN)
; upload_protocol = espota
; upload_port = <IP-Adresse des ESP32>
; upload_flags = --auth=<OTA-Passwort>
